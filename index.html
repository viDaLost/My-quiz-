<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏆 Quiz Master Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="container" id="main-container">
    <div id="home-screen" class="fade-in content-center">
        <header>
            <h1>Quiz Master</h1>
            <p class="hint">Создавай и побеждай!</p>
        </header>
        <button onclick="showCreator()" class="btn primary">Создать викторину</button>
        <p class="small-text">У вас есть ссылка? Перейдите по ней!</p>
    </div>

    <div id="creator-screen" class="hidden fade-in">
        <h2>Настройка</h2>
        <div class="field">
            <label>Режим игры:</label>
            <select id="quiz-mode">
                <option value="classic">Классика (результат в конце)</option>
                <option value="timer">Таймер на каждый вопрос</option>
                <option value="speed">Спидран (на общее время)</option>
            </select>
        </div>
        
        <div id="timer-setting" class="hidden field">
            <label>Секунд на ответ:</label>
            <input type="number" id="time-limit" placeholder="Например: 15" min="1">
        </div>

        <div id="questions-container"></div>
        
        <button onclick="addQuestionField()" class="btn secondary">+ Добавить вопрос</button>
        <button onclick="generateLink()" class="btn primary" style="margin-top: 10px;">Генерировать ссылку</button>
    </div>

    <div id="link-screen" class="hidden content-center">
        <h3>Готово! 🚀</h3>
        <textarea id="share-link" readonly></textarea>
        <button onclick="copyLink()" class="btn primary">Копировать ссылку</button>
        <button onclick="location.reload()" class="btn secondary">На главную</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="timer-container" class="hidden">
            <div id="timer-bar"></div>
        </div>
        <div class="card" id="question-card">
            <p id="question-text"></p>
        </div>
        <div id="options-container"></div>
        
        <div id="explanation-box" class="hidden">
            <div class="expl-content">
                <p id="explanation-status"></p>
                <p id="explanation-text"></p>
            </div>
            <button id="next-btn" onclick="nextQuestion()" class="btn primary">Далее ➡</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Ваш результат</h2>
        <div class="score-circle">
            <span id="score-val">0</span>
        </div>
        <p id="speed-result" class="hidden"></p>
        
        <div id="save-score-block" class="field">
            <input type="text" id="player-name" placeholder="Твоё имя">
            <button onclick="saveScore()" class="btn primary">Сохранить</button>
        </div>

        <div id="quiz-report" class="report-container">
            <h3>Детальный отчет:</h3>
            <div id="report-list"></div>
        </div>

        <button onclick="location.href = window.location.pathname" class="btn secondary" style="margin-top: 20px;">Создать свою</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
